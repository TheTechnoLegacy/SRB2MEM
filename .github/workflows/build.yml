name: Build SRB2MEM APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Fetch SDL2
        run: |
          git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL.git app/src/main/jni/SDL
          mkdir -p app/src/main/java/org/libsdl/app
          cp app/src/main/jni/SDL/android-project/app/src/main/java/org/libsdl/app/*.java app/src/main/java/org/libsdl/app/

      - name: Fetch SDL2_mixer
        run: |
          git clone --depth 1 --branch release-2.8.0 https://github.com/libsdl-org/SDL_mixer.git app/src/main/jni/SDL2_mixer
          cd app/src/main/jni/SDL2_mixer
          git submodule update --init --depth 1 external/libxmp

      - name: Fetch SRB2 2.0.6 game data
        continue-on-error: true
        run: |
          mkdir -p gamedata
          base=https://alam.srb2.org/SRB2/2.0.6-Final/Resources
          for f in srb2.wad zones.dta soar.dta drill.dta music.dta rings.wpn sonic.plr tails.plr knux.plr; do
            if ! ls gamedata/$f >/dev/null 2>&1; then
              curl -fL --retry 3 -o gamedata/$f $base/$f || echo "::warning::could not download $f"
            fi
          done
          ls -la gamedata

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SRB2MEM-apk
          path: app/build/outputs/apk/release/*.apk
